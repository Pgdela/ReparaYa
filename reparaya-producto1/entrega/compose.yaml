services:
  web:
    build: ./docker
    container_name: reparaya_web
    ports:
      - "8080:80"
    environment:
      APP_ENV_NAME: local
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./www:/var/www/html
    depends_on:
      - db
    networks:
      - reparaya_net

  db:
    image: mysql:8.0
    container_name: reparaya_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - reparaya_net

  phpmyadmin:
    image: phpmyadmin:5
    container_name: reparaya_pma
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - reparaya_net

networks:
  reparaya_net:

volumes:
  db_data: