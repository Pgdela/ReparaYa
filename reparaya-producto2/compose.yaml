
services:
  web:
    build: ./docker
    container_name: reparaya_web
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
    environment:
      APP_ENV_NAME: "local"
      DB_HOST: "db"
      DB_NAME: "reparaya"
      DB_USER: "reparaya_user"
      DB_PASSWORD: "123456"
    depends_on:
      - db
    networks:
      - reparaya_net

  db:
    image: mysql:8.0
    container_name: reparaya_db
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "reparaya"
      MYSQL_USER: "reparaya_user"
      MYSQL_PASSWORD: "123456"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - reparaya_net

  phpmyadmin:
    image: phpmyadmin:5
    container_name: reparaya_pma
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - reparaya_net

networks:
  reparaya_net:

volumes:
  db_data:
